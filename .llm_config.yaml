main_agents:
  model: claude-opus-4-6
  reasoning_effort: high
  budget_tokens: 128000
run_experiment_tool:
  code_model: claude-opus-4-6
  feedback_model: claude-opus-4-6
  vlm_model: claude-opus-4-6
  report_model: claude-opus-4-6
budget:
  usd_limit: 700
  hard_stop: true
  fail_closed: true
  # OpenRouter pricing (includes ~5% markup over direct provider rates)
  pricing:
    gpt-5:
      input_per_1k: 0.0021
      output_per_1k: 0.0126
    gpt-5.2:
      input_per_1k: 0.00184
      output_per_1k: 0.0147
    gpt-5.4:
      input_per_1k: 0.00263
      output_per_1k: 0.01575
    gemini-3-pro-preview:
      input_per_1k: 0.00131
      output_per_1k: 0.0105
    gpt-5.3-codex:
      input_per_1k: 0.0021
      output_per_1k: 0.0105
    claude-opus-4-6:
      input_per_1k: 0.00525
      output_per_1k: 0.02625
    claude-sonnet-4-6:
      input_per_1k: 0.00315
      output_per_1k: 0.01575
    claude-sonnet-4-5:
      input_per_1k: 0.00315
      output_per_1k: 0.01575
counsel:
  enabled: true
  max_debate_rounds: 3
  synthesis_model: claude-opus-4-6
  models:
  - model: claude-opus-4-6
    reasoning_effort: high
  - model: gpt-5.4
    reasoning_effort: high
    verbosity: high
  - model: gemini-3-pro-preview
    thinking_budget: 131072
persona_council:
  max_debate_rounds: 3
  synthesis_model: claude-opus-4-6
duality_check:
  model: claude-opus-4-6
per_agent_models:
  enabled: true
  tiers:
    opus:
      model: claude-opus-4-6
      reasoning_effort: high
      budget_tokens: 128000
    sonnet:
      model: claude-sonnet-4-6
      reasoning_effort: high
      budget_tokens: 128000
    economy:
      model: claude-sonnet-4-6
      reasoning_effort: low
  agent_tiers:
    literature_review_agent: sonnet
    math_literature_agent: sonnet
    experiment_literature_agent: sonnet
    math_empirical_verifier_agent: sonnet
    formalize_results_agent: sonnet
    writeup_agent: sonnet
    reviewer_agent: sonnet
    experimentation_agent: sonnet
    followup_lit_review: sonnet
    proofreading_agent: economy
    proof_transcription_agent: economy
    experiment_transcription_agent: economy
    resource_preparation_agent: economy
